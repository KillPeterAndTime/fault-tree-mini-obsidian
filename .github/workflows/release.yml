name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach attestations to"
        required: true
        default: "1.0.1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match manifest version $VER"
            exit 1
          fi

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
          if [ -n "${{ steps.attest.outputs.bundle-path }}" ]; then
            gh release upload "$TAG" "${{ steps.attest.outputs.bundle-path }}" --clobber
          fi
